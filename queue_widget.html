<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="no-referrer">
    <title>Queue Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --accent: #8b7cff;
            --accent-soft: rgba(139, 124, 255, 0.35);
            --glass: rgba(12, 14, 18, 0.72);
            --glass-opaque: rgba(12, 14, 18, 0.92);
            --line: rgba(255, 255, 255, 0.10);
            --text: #ffffff;
            --text-2: rgba(255, 255, 255, 0.72);
            --text-3: rgba(255, 255, 255, 0.50);
            --warn-bg: rgba(255, 170, 80, 0.14);
            --warn-line: rgba(255, 170, 80, 0.35);
            --warn-text: #ffd9a8;
            --radius: 20px;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            --font-display: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
            --over-video-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: var(--text);
            font-family: var(--font-body);
            font-weight: 500;
            line-height: 1.3;
            -webkit-font-smoothing: antialiased;
        }
        html.transparent-bg, html.transparent-bg body { background: transparent; }

        .widget {
            width: 100%;
            height: 100%;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .panel {
            position: relative;
            overflow: hidden;
            isolation: isolate;
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            backdrop-filter: blur(18px) saturate(140%);
        }

        /* ── Now playing hero ─────────────────────────────────────────── */
        .now { padding: 16px; flex-shrink: 0; }
        .now-backdrop {
            position: absolute;
            inset: -20%;
            z-index: -1;
            pointer-events: none;
            background: var(--art-url, linear-gradient(135deg, #1b1830, #0d1a1f)) center / cover no-repeat;
            filter: blur(40px) brightness(0.55) saturate(1.3);
            transform: scale(1.3);
            opacity: 0.65;
            transition: opacity 0.6s ease;
        }
        .now-wrap { display: flex; gap: 16px; align-items: center; }
        .now-art {
            width: clamp(88px, 22vw, 150px);
            height: clamp(88px, 22vw, 150px);
            flex-shrink: 0;
            border-radius: 14px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }
        .now-art.no-art { object-fit: contain; padding: 10px; }
        .now-main { flex: 1; min-width: 0; }
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: clamp(11px, 1.6vw, 13px);
            font-weight: 600;
            letter-spacing: 0.4px;
            color: var(--text-2);
        }
        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: breathe 2.4s ease-in-out infinite;
        }
        .paused .live-dot { animation: none; opacity: 0.5; box-shadow: none; }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.75); opacity: 0.55; }
        }
        .track {
            margin-top: 6px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: clamp(20px, 4.4vw, 30px);
            line-height: 1.15;
            letter-spacing: -0.3px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: var(--over-video-shadow);
        }
        .artist {
            margin-top: 4px;
            font-size: clamp(14px, 2.4vw, 17px);
            font-weight: 600;
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .artist:empty { display: none; }
        .time-row {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-family: var(--font-display);
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: clamp(12px, 2vw, 14px);
            color: var(--text-2);
        }
        .bar {
            margin-top: 8px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.14);
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent-soft);
            transition: width 0.35s linear;
        }

        /* ── Up next ──────────────────────────────────────────────────── */
        .queue-panel {
            flex: 1;
            min-height: 0;
            padding: 14px 14px 12px;
            display: flex;
            flex-direction: column;
        }
        .queue-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }
        .title {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: clamp(16px, 3vw, 20px);
            letter-spacing: -0.2px;
        }
        .count {
            font-family: var(--font-display);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            font-size: clamp(12px, 1.8vw, 14px);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--accent-soft);
            border: 1px solid var(--line);
            white-space: nowrap;
        }
        .status {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: clamp(11px, 1.6vw, 13px);
            font-weight: 600;
            line-height: 1.3;
            background: var(--warn-bg);
            border: 1px solid var(--warn-line);
            color: var(--warn-text);
        }
        .status[data-level="info"] { display: none; }
        .queue-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .queue-list::-webkit-scrollbar { display: none; }
        .queue-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            animation: rowIn 0.25s ease-out both;
        }
        @keyframes rowIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: none; }
        }
        .pos {
            font-family: var(--font-display);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            font-size: clamp(12px, 1.8vw, 14px);
            color: var(--text-3);
            min-width: 1.4em;
            text-align: center;
            flex-shrink: 0;
        }
        .art {
            width: clamp(44px, 10vw, 56px);
            height: clamp(44px, 10vw, 56px);
            border-radius: 10px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .art:empty { display: none; }
        .item-main { flex: 1; min-width: 0; }
        .song {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(15px, 2.6vw, 17px);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: var(--over-video-shadow);
        }
        .meta {
            margin-top: 3px;
            font-size: clamp(12px, 1.9vw, 13px);
            font-weight: 500;
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .meta .sep { margin: 0 6px; color: var(--text-3); }
        .eta {
            flex-shrink: 0;
            text-align: right;
            font-family: var(--font-display);
            font-variant-numeric: tabular-nums;
        }
        .eta-start {
            display: block;
            font-weight: 700;
            font-size: clamp(14px, 2.2vw, 16px);
            white-space: nowrap;
        }
        .eta-end {
            display: block;
            margin-top: 2px;
            font-weight: 600;
            font-size: clamp(11px, 1.6vw, 12px);
            color: var(--text-3);
            white-space: nowrap;
        }
        .empty {
            height: 100%;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 20px;
            color: var(--text-2);
            font-weight: 600;
            font-size: clamp(14px, 2.4vw, 17px);
            line-height: 1.45;
        }
        .empty strong { color: var(--text); font-family: var(--font-display); }

        /* ── Hint, connection, toast ──────────────────────────────────── */
        .request-hint {
            margin-top: 10px;
            padding: 9px 12px;
            border-radius: 12px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            font-size: clamp(12px, 1.9vw, 14px);
            color: var(--text-2);
            line-height: 1.4;
        }
        .request-hint strong { color: var(--text); font-family: var(--font-display); font-weight: 700; }
        .connection-status {
            padding: 8px 12px;
            border-radius: 12px;
            background: var(--warn-bg);
            border: 1px solid var(--warn-line);
            color: var(--warn-text);
            font-size: 13px;
            font-weight: 600;
        }
        .connection-status[hidden] { display: none; }
        .request-toast {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%) translateY(-22px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            border-radius: 999px;
            background: var(--glass-opaque);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            color: var(--text);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(12px, 1.8vw, 15px);
            max-width: min(92vw, 900px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .request-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .request-toast.accepted { border-color: var(--accent); }
        .request-toast.rejected { border-color: var(--warn-line); }
        .request-toast-icon { flex-shrink: 0; line-height: 1; }
        .request-toast-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ── Adaptive ─────────────────────────────────────────────────── */
        @media (orientation: portrait) {
            .widget { padding: 10px; gap: 8px; }
            .queue-item { padding: 9px 10px; }
        }
        @media (min-aspect-ratio: 4/3) and (min-width: 640px) {
            .widget { flex-direction: row; align-items: stretch; }
            .now { flex: 0 0 40%; display: flex; }
            .now-wrap { flex-direction: column; align-items: flex-start; justify-content: center; width: 100%; }
            .now-art { width: min(100%, 220px); height: auto; aspect-ratio: 1; }
            .now-main { width: 100%; }
            .track { font-size: clamp(22px, 2.6vw, 34px); }
            .queue-panel { flex: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>
    <div class="widget" id="widget">
        <div class="connection-status" id="connection-status" role="status" aria-live="polite">Connecting to overlay server...</div>
        <section class="panel now" id="now-panel" aria-label="Now playing">
            <div class="now-backdrop" aria-hidden="true"></div>
            <div class="now-wrap">
                <img class="now-art no-art" id="now-art" alt="">
                <div class="now-main">
                    <div class="eyebrow"><span class="live-dot" aria-hidden="true"></span><span>Now playing</span></div>
                    <div class="track" id="now-track">Waiting for Spotify</div>
                    <div class="artist" id="now-artist"></div>
                    <div class="time-row">
                        <div id="now-time">--:-- / --:--</div>
                        <div id="now-state">-</div>
                    </div>
                    <div class="bar"><div class="bar-fill" id="now-bar"></div></div>
                </div>
            </div>
        </section>

        <section class="panel queue-panel" aria-label="Up next">
            <div class="queue-head">
                <div class="title">Up Next</div>
                <div class="count" id="queue-count">0 queued</div>
            </div>
            <div class="status" id="queue-status" role="status" aria-live="polite" data-level="info">Waiting for queue sync...</div>
            <div class="queue-list" id="queue-list" role="list" aria-label="Upcoming songs">
                <div class="empty">No queued songs yet</div>
            </div>
            <div class="request-hint">Request: <strong>!req Song by Artist</strong> · Skip: <strong>!skip</strong></div>
        </section>
    </div>
    <div class="request-toast" id="request-toast" role="status" aria-live="polite">
        <span class="request-toast-icon" id="request-toast-icon">&#127911;</span>
        <span class="request-toast-text" id="request-toast-text"></span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        let nowPlaying = null;
        const PAGE_PARAMS = new URLSearchParams(window.location.search);
        let nowAnchorMs = 0;
        let nowDisplayedElapsed = 0;
        let nowKey = '';
        let requestQueueItems = [];
        let spotifyQueueItems = [];
        let queueItems = [];
        let overlayConnected = false;
        let nowPlayingNeedsSync = true;
        const QUEUE_SOURCE_MODE = String(PAGE_PARAMS.get('queue_source') || 'auto').trim().toLowerCase();
        const FORCE_SPOTIFY_SOURCE = QUEUE_SOURCE_MODE === 'spotify';
        const AUTO_SOURCE_MODE = QUEUE_SOURCE_MODE === 'auto';
        let usingSpotifyQueue = FORCE_SPOTIFY_SOURCE;
        let spotifyQueueStatus = { auth_ready: false, count: 0, last_error: '', updated_at: 0, manual_only: false, manual_pending: 0, manual_mode: 'tracked' };
        let lastQueueSignature = '';
        const AUTO_SCROLL_ENABLED = false;
        const AUTO_SCROLL_SPEED_PX_PER_SEC = 26;
        const AUTO_SCROLL_EDGE_PAUSE_MS = 1600;
        const AUTO_SCROLL_START_DELAY_MS = 1000;
        const AUTO_SCROLL_MIN_OVERFLOW_PX = 18;
        const AUTO_SCROLL_TICK_MS = 60;
        const DEFAULT_QUEUE_DURATION_SEC = 210;
        const FALLBACK_NOW_ART = 'data:image/svg+xml;utf8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">' +
            '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
            '<stop offset="0" stop-color="#2a2547"/><stop offset="1" stop-color="#12242b"/>' +
            '</linearGradient></defs>' +
            '<rect width="220" height="220" rx="24" fill="url(#g)"/>' +
            '<circle cx="110" cy="110" r="58" fill="rgba(0,0,0,0.24)"/>' +
            '<circle cx="110" cy="110" r="18" fill="rgba(255,255,255,0.85)"/>' +
            '</svg>'
        );

        // Cached DOM elements
        let nowTrackEl, nowArtistEl, nowTimeEl, nowStateEl, nowBarEl, nowArtEl, nowPanelEl, widgetEl;
        // Last rendered values
        let lastTitle = '', lastArtist = '', lastElapsed = 0, lastDuration = 0, lastPlaying = false, lastArt = '';
        // Animation control
        let nowTickerId = null;
        const NOW_TICK_MS = 250;
        let isVisible = true;
        let etaTickerId = null;
        let queueAutoScrollTimerId = null;
        let queueAutoScrollLastTickMs = 0;
        let queueAutoScrollDir = 1;
        let queueAutoScrollPauseUntil = 0;
        let queueAutoScrollArmedUntil = 0;
        let requestToastTimerId = null;

        if (PAGE_PARAMS.get('bg') === 'transparent' || PAGE_PARAMS.get('transparent') === '1') {
            document.documentElement.classList.add('transparent-bg');
        }

        function cacheElements() {
            widgetEl = document.getElementById('widget');
            nowPanelEl = document.getElementById('now-panel');
            nowTrackEl = document.getElementById('now-track');
            nowArtistEl = document.getElementById('now-artist');
            nowTimeEl = document.getElementById('now-time');
            nowStateEl = document.getElementById('now-state');
            nowBarEl = document.getElementById('now-bar');
            nowArtEl = document.getElementById('now-art');
        }

        // ── Accent color sampled from album art ─────────────────────────
        const accentCache = {};
        function setAccent(color, soft) {
            if (!widgetEl) return;
            if (color) {
                widgetEl.style.setProperty('--accent', color);
                widgetEl.style.setProperty('--accent-soft', soft);
            } else {
                widgetEl.style.removeProperty('--accent');
                widgetEl.style.removeProperty('--accent-soft');
            }
        }
        function applyAccentFromArt(url) {
            if (!widgetEl) return;
            if (!url || url === FALLBACK_NOW_ART) {
                widgetEl.style.removeProperty('--art-url');
                setAccent(null);
                return;
            }
            widgetEl.style.setProperty('--art-url', 'url("' + url.replace(/["\\\s]/g, '') + '")');
            const cached = accentCache[url];
            if (cached) { setAccent(cached.color, cached.soft); return; }
            try {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function() {
                    try {
                        const c = document.createElement('canvas');
                        c.width = 16; c.height = 16;
                        const g = c.getContext('2d');
                        g.drawImage(img, 0, 0, 16, 16);
                        const d = g.getImageData(0, 0, 16, 16).data;
                        let r = 0, gg = 0, b = 0, n = 0;
                        for (let i = 0; i < d.length; i += 4) {
                            const max = Math.max(d[i], d[i + 1], d[i + 2]);
                            const min = Math.min(d[i], d[i + 1], d[i + 2]);
                            if (max - min < 24) continue; // skip greys so the accent stays colorful
                            r += d[i]; gg += d[i + 1]; b += d[i + 2]; n++;
                        }
                        if (!n) return;
                        r /= n; gg /= n; b /= n;
                        const lum = (0.2126 * r + 0.7152 * gg + 0.0722 * b) / 255;
                        const target = Math.min(0.75, Math.max(0.45, lum));
                        const k = target / Math.max(lum, 0.01);
                        const clamp = v => Math.max(0, Math.min(255, Math.round(v * k)));
                        const rgb = clamp(r) + ',' + clamp(gg) + ',' + clamp(b);
                        accentCache[url] = { color: 'rgb(' + rgb + ')', soft: 'rgba(' + rgb + ',0.35)' };
                        setAccent(accentCache[url].color, accentCache[url].soft);
                    } catch (e) { /* tainted canvas or decode issue: keep the default accent */ }
                };
                img.src = url;
            } catch (e) { /* keep the default accent */ }
        }

        function startAnimation() {
            if (nowTickerId) return;
            nowTickerId = setInterval(function() {
                if (isVisible && nowPlaying && nowPlaying.playing) {
                    renderNow();
                }
            }, NOW_TICK_MS);
        }

        function stopAnimation() {
            if (nowTickerId) {
                clearInterval(nowTickerId);
                nowTickerId = null;
            }
        }

        function fmt(sec) {
            const s = Math.max(0, Math.floor(Number(sec) || 0));
            const m = Math.floor(s / 60);
            const r = s % 60;
            return m + ':' + String(r).padStart(2, '0');
        }

        function fmtEta(sec, estimated) {
            return (estimated ? '~' : '') + fmt(sec);
        }

        function currentElapsedSec() {
            if (!nowPlaying || !nowPlaying.available) return 0;
            if (!overlayConnected || nowPlayingNeedsSync) return nowDisplayedElapsed;
            let elapsedCandidate = nowPlaying.playing
                ? ((Date.now() - nowAnchorMs) / 1000)
                : nowPlaying.elapsed;
            elapsedCandidate = Math.max(0, Math.min(elapsedCandidate, nowPlaying.duration || elapsedCandidate));

            if (nowPlaying.playing) {
                // Keep ETA countdown monotonic while playing to prevent jittery backwards jumps.
                nowDisplayedElapsed = Math.max(nowDisplayedElapsed, elapsedCandidate);
            } else {
                nowDisplayedElapsed = elapsedCandidate;
            }
            if (nowPlaying.duration > 0) {
                nowDisplayedElapsed = Math.min(nowDisplayedElapsed, nowPlaying.duration);
            }
            return Math.max(0, nowDisplayedElapsed);
        }

        function showRequestToast(message, kind) {
            const toast = document.getElementById('request-toast');
            const text = document.getElementById('request-toast-text');
            const icon = document.getElementById('request-toast-icon');
            if (!toast || !text || !icon) return;

            const type = String(kind || 'accepted').toLowerCase() === 'rejected' ? 'rejected' : 'accepted';
            toast.classList.remove('accepted', 'rejected', 'show');
            toast.classList.add(type);
            icon.innerHTML = type === 'accepted' ? '&#127911;' : '&#9888;';
            text.textContent = String(message || '');

            toast.classList.add('show');
            if (requestToastTimerId) clearTimeout(requestToastTimerId);
            requestToastTimerId = setTimeout(function() {
                toast.classList.remove('show');
            }, 3200);
        }

        function handleRequestFeedback(payload) {
            if (!payload || typeof payload !== 'object') return;
            const status = String(payload.status || '').toLowerCase();
            const reason = String(payload.reason || '').toLowerCase();
            const user = String(payload.user || 'viewer');
            const song = String(payload.song || 'request');

            if (status === 'accepted') {
                const destination = payload.spotify_queued ? 'Queued on Spotify: ' : 'Request saved: ';
                showRequestToast(destination + song + ' (' + user + ')', 'accepted');
                return;
            }

            if (reason === 'cooldown') {
                const waitSec = Math.max(0, Math.floor(Number(payload.wait_seconds) || 0));
                const waitText = waitSec > 0 ? ('Try again in ' + waitSec + 's') : 'Try again soon';
                showRequestToast('Hold up ' + user + '. ' + waitText, 'rejected');
                return;
            }

            if (reason === 'duplicate_recent') {
                showRequestToast('Already requested recently: ' + song, 'rejected');
            }
        }

        function parseSong(raw) {
            let title = String(raw || '').trim();
            let artist = '';
            const upper = title.toUpperCase();
            if (upper.includes(' BY ')) {
                const idx = upper.indexOf(' BY ');
                artist = title.substring(idx + 4).trim();
                title = title.substring(0, idx).trim();
            }
            return { title, artist };
        }

        function normalizedQueueItem(item) {
            const raw = item || {};
            const spotifyTrack = String(raw.spotify_track || '').trim();
            const spotifyArtist = String(raw.spotify_artist || '').trim();
            const albumArt = String(raw.album_art || '').trim();
            if (spotifyTrack) {
                return {
                    title: spotifyTrack,
                    artist: spotifyArtist,
                    user: String(raw.user || ''),
                    duration_sec: Math.floor(Number(raw.duration_sec) || 0),
                    source: String(raw.source || 'spotify_queue'),
                    album_art: albumArt
                };
            }
            const parsed = parseSong(raw.song);
            return {
                title: parsed.title,
                artist: parsed.artist,
                user: String(raw.user || ''),
                duration_sec: Math.floor(Number(raw.duration_sec) || 0),
                source: String(raw.source || 'request_queue'),
                album_art: albumArt
            };
        }

        function queueSignature(list) {
            try {
                return JSON.stringify((list || []).map(function(it) {
                    return {
                        t: String(it.spotify_track || it.song || ''),
                        a: String(it.spotify_artist || ''),
                        d: Number(it.duration_sec || 0),
                        s: String(it.source || ''),
                        u: String(it.user || ''),
                        i: String(it.album_art || '')
                    };
                }));
            } catch (e) {
                return String(Date.now());
            }
        }

        function remainingNowSec() {
            if (!nowPlaying || !nowPlaying.available || nowPlaying.duration <= 0) {
                return { remaining: 0, estimated: true };
            }
            const elapsed = currentElapsedSec();
            return { remaining: Math.max(0, Math.floor(nowPlaying.duration - elapsed)), estimated: false };
        }

        function queueWindow(index) {
            const base = remainingNowSec();
            let startSec = base.remaining;
            let estimatedStart = base.estimated;

            for (let i = 0; i < index; i++) {
                let d = Math.floor(Number((queueItems[i] || {}).duration_sec) || 0);
                if (d <= 0) {
                    d = DEFAULT_QUEUE_DURATION_SEC;
                    estimatedStart = true;
                }
                startSec += d;
            }

            let dThis = Math.floor(Number((queueItems[index] || {}).duration_sec) || 0);
            let estimatedEnd = estimatedStart;
            if (dThis <= 0) {
                dThis = DEFAULT_QUEUE_DURATION_SEC;
                estimatedEnd = true;
            }
            return {
                start: Math.max(0, startSec),
                end: Math.max(0, startSec + dThis),
                estimatedStart,
                estimatedEnd
            };
        }

        function etaStartText(win) { return 'in ' + fmtEta(win.start, win.estimatedStart); }
        function etaEndText(win) { return 'ends ' + fmtEta(win.end, win.estimatedEnd); }

        function refreshQueueEtaLabels() {
            if (!Array.isArray(queueItems) || queueItems.length === 0) return;

            document.querySelectorAll('.eta-start[data-index]').forEach((el) => {
                const idx = Number(el.getAttribute('data-index'));
                if (!Number.isFinite(idx)) return;
                el.textContent = etaStartText(queueWindow(idx));
            });

            document.querySelectorAll('.eta-end[data-index]').forEach((el) => {
                const idx = Number(el.getAttribute('data-index'));
                if (!Number.isFinite(idx)) return;
                el.textContent = etaEndText(queueWindow(idx));
            });
        }

        function stopQueueAutoScroll() {
            if (queueAutoScrollTimerId) {
                clearInterval(queueAutoScrollTimerId);
                queueAutoScrollTimerId = null;
            }
            queueAutoScrollLastTickMs = 0;
        }

        function queueAutoScrollTick() {
            const list = document.getElementById('queue-list');
            if (!list || !AUTO_SCROLL_ENABLED) {
                stopQueueAutoScroll();
                return;
            }

            const overflow = Math.max(0, list.scrollHeight - list.clientHeight);
            if (overflow < AUTO_SCROLL_MIN_OVERFLOW_PX) {
                list.scrollTop = 0;
                queueAutoScrollLastTickMs = Date.now();
                return;
            }

            const now = Date.now();
            if (now < queueAutoScrollArmedUntil || now < queueAutoScrollPauseUntil) {
                queueAutoScrollLastTickMs = now;
                return;
            }

            if (!queueAutoScrollLastTickMs) queueAutoScrollLastTickMs = now;
            const dt = Math.min(0.25, Math.max(0, (now - queueAutoScrollLastTickMs) / 1000));
            queueAutoScrollLastTickMs = now;

            let nextTop = list.scrollTop + (queueAutoScrollDir * AUTO_SCROLL_SPEED_PX_PER_SEC * dt);

            if (queueAutoScrollDir > 0 && nextTop >= overflow) {
                nextTop = overflow;
                queueAutoScrollDir = -1;
                queueAutoScrollPauseUntil = now + AUTO_SCROLL_EDGE_PAUSE_MS;
            } else if (queueAutoScrollDir < 0 && nextTop <= 0) {
                nextTop = 0;
                queueAutoScrollDir = 1;
                queueAutoScrollPauseUntil = now + AUTO_SCROLL_EDGE_PAUSE_MS;
            }

            list.scrollTop = nextTop;
        }

        function startQueueAutoScroll(resetPosition) {
            const list = document.getElementById('queue-list');
            if (!list || !AUTO_SCROLL_ENABLED) return;
            if (queueAutoScrollTimerId && !resetPosition) {
                return;
            }
            if (resetPosition) {
                list.scrollTop = 0;
                queueAutoScrollDir = 1;
                queueAutoScrollPauseUntil = 0;
            }
            queueAutoScrollArmedUntil = Date.now() + AUTO_SCROLL_START_DELAY_MS;
            queueAutoScrollLastTickMs = Date.now();
            if (!queueAutoScrollTimerId) {
                queueAutoScrollTimerId = setInterval(queueAutoScrollTick, AUTO_SCROLL_TICK_MS);
                queueAutoScrollTick();
            }
        }

        function syncQueueSourceAndRender() {
            let sourceItems;
            if (FORCE_SPOTIFY_SOURCE) {
                usingSpotifyQueue = true;
                sourceItems = Array.isArray(spotifyQueueItems) ? spotifyQueueItems : [];
            } else if (AUTO_SOURCE_MODE) {
                const spotifyReady = !!(spotifyQueueStatus && spotifyQueueStatus.auth_ready);
                // Keep accepted viewer requests visible while Spotify syncs an empty queue.
                usingSpotifyQueue = spotifyReady && spotifyQueueItems.length > 0;
                sourceItems = usingSpotifyQueue
                    ? spotifyQueueItems
                    : (Array.isArray(requestQueueItems) ? requestQueueItems : []);
            } else {
                usingSpotifyQueue = false;
                sourceItems = Array.isArray(requestQueueItems) ? requestQueueItems : [];
            }
            queueItems = sourceItems.filter(function(item) {
                if (!nowPlaying || !nowPlaying.available) return true;
                const requested = parseSong(String(item && item.song || ''));
                const title = String(item && item.spotify_track || requested.title).trim().toLowerCase();
                const artist = String(item && item.spotify_artist || requested.artist).trim().toLowerCase();
                const currentTitle = String(nowPlaying.title || '').trim().toLowerCase();
                const currentArtist = String(nowPlaying.artist || '').trim().toLowerCase();
                return !(title === currentTitle && artist === currentArtist);
            });
            renderQueue();
        }

        function renderQueue() {
            const list = document.getElementById('queue-list');
            const count = document.getElementById('queue-count');
            const status = document.getElementById('queue-status');
            const n = Array.isArray(queueItems) ? queueItems.length : 0;

            // Always update status/count, but only rebuild list when queue data changed.
            const sig = queueSignature(queueItems);
            const queueChanged = sig !== lastQueueSignature;
            count.textContent = n + ' queued';
            if (status) {
                // Viewers only need to see the status when something is wrong; "info" is hidden by CSS.
                let level = 'info';
                if (!overlayConnected) {
                    status.textContent = 'Connection lost. Showing the last known queue.';
                    level = 'warn';
                } else if ((FORCE_SPOTIFY_SOURCE || AUTO_SOURCE_MODE || usingSpotifyQueue) && spotifyQueueStatus.last_error) {
                    status.textContent = 'Spotify sync unavailable. Showing the last known queue.';
                    level = 'warn';
                } else if (FORCE_SPOTIFY_SOURCE && !spotifyQueueStatus.auth_ready) {
                    status.textContent = 'Spotify is not configured. Use queue_source=auto for local requests.';
                    level = 'warn';
                } else if (!FORCE_SPOTIFY_SOURCE && !AUTO_SOURCE_MODE) {
                    status.textContent = 'Source: Request queue';
                } else if (usingSpotifyQueue) {
                    const manualOnly = !!(spotifyQueueStatus && spotifyQueueStatus.manual_only);
                    const manualPending = Math.max(0, Number((spotifyQueueStatus && spotifyQueueStatus.manual_pending) || 0));
                    const manualMode = String((spotifyQueueStatus && spotifyQueueStatus.manual_mode) || 'tracked').toLowerCase();
                    status.textContent = manualOnly
                        ? 'Source: Spotify queue (manual only, ' + manualMode + ' ' + manualPending + ')'
                        : 'Source: Spotify queue';
                } else {
                    status.textContent = 'Viewer requests · Spotify playback is not connected';
                }
                status.setAttribute('data-level', level);
            }
            if (!queueChanged) {
                refreshQueueEtaLabels();
                startQueueAutoScroll(false);
                return;
            }
            lastQueueSignature = sig;

            if (!n) {
                list.innerHTML = '<div class="empty">No queued songs yet<br><strong>!req Song by Artist</strong> to add one</div>';
                stopQueueAutoScroll();
                return;
            }

            const fragment = document.createDocumentFragment();
            queueItems.forEach((item, i) => {
                const p = normalizedQueueItem(item);
                const win = queueWindow(i);
                const requester = String(p.user || '').trim();
                const sourceLabel = p.source === 'spotify_queue' ? 'Spotify queue' : 'Requests';

                const div = document.createElement('div');
                div.className = 'queue-item';
                div.setAttribute('role', 'listitem');

                const pos = document.createElement('div');
                pos.className = 'pos';
                pos.textContent = String(i + 1);

                const artDiv = document.createElement('div');
                artDiv.className = 'art';
                if (p.album_art) {
                    const img = document.createElement('img');
                    img.src = p.album_art;
                    img.alt = '';
                    img.loading = 'lazy';
                    img.decoding = 'async';
                    img.referrerPolicy = 'no-referrer';
                    img.addEventListener('error', function() { img.remove(); }, { once: true });
                    artDiv.appendChild(img);
                }

                const mainDiv = document.createElement('div');
                mainDiv.className = 'item-main';

                const songDiv = document.createElement('div');
                songDiv.className = 'song';
                songDiv.textContent = p.title || 'Unknown Song';
                mainDiv.appendChild(songDiv);

                const metaDiv = document.createElement('div');
                metaDiv.className = 'meta';
                if (p.artist) metaDiv.appendChild(document.createTextNode(p.artist));
                if (requester) {
                    if (p.artist) {
                        const sep = document.createElement('span');
                        sep.className = 'sep';
                        sep.textContent = '·';
                        metaDiv.appendChild(sep);
                    }
                    metaDiv.appendChild(document.createTextNode('requested by ' + requester));
                } else if (!p.artist) {
                    metaDiv.textContent = sourceLabel;
                }
                mainDiv.appendChild(metaDiv);

                const etaDiv = document.createElement('div');
                etaDiv.className = 'eta';
                const startValue = document.createElement('span');
                startValue.className = 'eta-start';
                startValue.setAttribute('data-index', String(i));
                startValue.textContent = etaStartText(win);
                const endValue = document.createElement('span');
                endValue.className = 'eta-end';
                endValue.setAttribute('data-index', String(i));
                endValue.textContent = etaEndText(win);
                etaDiv.appendChild(startValue);
                etaDiv.appendChild(endValue);

                div.appendChild(pos);
                div.appendChild(artDiv);
                div.appendChild(mainDiv);
                div.appendChild(etaDiv);
                fragment.appendChild(div);
            });

            list.innerHTML = '';
            list.appendChild(fragment);
            if (!AUTO_SCROLL_ENABLED) {
                list.scrollTop = 0;
            }
            refreshQueueEtaLabels();
            startQueueAutoScroll(true);
        }

        function renderNow() {
            if (!nowPlaying || !nowPlaying.available) {
                if (lastTitle !== 'Waiting for Spotify' || lastArtist !== '' || lastElapsed !== 0 || lastDuration !== 0 || lastPlaying !== false || lastArt !== FALLBACK_NOW_ART) {
                    nowTrackEl.textContent = 'Waiting for Spotify';
                    nowArtistEl.textContent = '';
                    nowTimeEl.textContent = '--:-- / --:--';
                    nowStateEl.textContent = '-';
                    nowBarEl.style.width = '0%';
                    nowArtEl.classList.add('no-art');
                    nowArtEl.src = FALLBACK_NOW_ART;
                    nowPanelEl.classList.remove('paused');
                    applyAccentFromArt('');
                    lastTitle = 'Waiting for Spotify';
                    lastArtist = '';
                    lastElapsed = 0;
                    lastDuration = 0;
                    lastPlaying = false;
                    lastArt = FALLBACK_NOW_ART;
                }
                return;
            }

            const title = nowPlaying.title || 'Unknown Track';
            const artist = nowPlaying.artist || '';
            const elapsed = currentElapsedSec();
            const duration = Math.max(0, nowPlaying.duration || 0);
            const barWidth = duration > 0 ? Math.min(100, (elapsed / duration) * 100) : 0;
            const art = String(nowPlaying.album_art || '').trim() || FALLBACK_NOW_ART;

            const elapsedRounded = Math.floor(elapsed);
            if (title !== lastTitle || artist !== lastArtist || elapsedRounded !== lastElapsed || duration !== lastDuration || nowPlaying.playing !== lastPlaying || art !== lastArt) {
                nowTrackEl.textContent = title;
                nowArtistEl.textContent = artist;
                nowTimeEl.textContent = fmt(elapsedRounded) + ' / ' + fmt(duration);
                nowStateEl.textContent = overlayConnected ? (nowPlaying.playing ? 'Playing' : 'Paused') : 'Reconnecting';
                nowBarEl.style.width = barWidth + '%';
                nowPanelEl.classList.toggle('paused', !nowPlaying.playing);
                if (art !== lastArt) {
                    nowArtEl.classList.toggle('no-art', art === FALLBACK_NOW_ART);
                    nowArtEl.src = art;
                    applyAccentFromArt(art);
                }
                lastTitle = title;
                lastArtist = artist;
                lastElapsed = elapsedRounded;
                lastDuration = duration;
                lastPlaying = nowPlaying.playing;
                lastArt = art || FALLBACK_NOW_ART;
            }
        }

        function handleNow(data) {
            if (!data || !data.available) {
                nowPlaying = null;
                nowKey = '';
                nowAnchorMs = 0;
                nowDisplayedElapsed = 0;
                stopAnimation();
                syncQueueSourceAndRender();
                renderNow();
                return;
            }

            const incoming = {
                available: true,
                title: String(data.title || '').trim(),
                artist: String(data.artist || '').trim(),
                elapsed: Math.max(0, Math.floor(Number(data.elapsed) || 0)),
                duration: Math.max(0, Math.floor(Number(data.duration) || 0)),
                playing: !!data.playing,
                album_art: String(data.album_art || '').trim()
            };

            const key = (incoming.title + '|' + incoming.artist).toLowerCase();
            const nowMs = Date.now();
            if (nowPlayingNeedsSync || !nowKey || key !== nowKey || (nowPlaying && !nowPlaying.playing && incoming.playing)) {
                nowAnchorMs = nowMs - (incoming.elapsed * 1000);
                nowDisplayedElapsed = incoming.elapsed;
                nowKey = key;
            } else {
                const localElapsed = nowPlaying && nowPlaying.playing
                    ? Math.max(nowDisplayedElapsed, ((nowMs - nowAnchorMs) / 1000))
                    : nowDisplayedElapsed;
                const drift = incoming.elapsed - localElapsed;
                // Apply only larger corrections. Small drift is expected polling jitter.
                if (drift > 2.2) {
                    nowAnchorMs = nowMs - (incoming.elapsed * 1000);
                } else if (drift < -5) {
                    nowAnchorMs = nowMs - (incoming.elapsed * 1000);
                    nowDisplayedElapsed = incoming.elapsed;
                }
            }

            if (!incoming.playing) {
                nowAnchorMs = nowMs - (incoming.elapsed * 1000);
                nowDisplayedElapsed = incoming.elapsed;
            }

            nowPlaying = incoming;
            nowPlayingNeedsSync = false;
            if (incoming.playing && isVisible && overlayConnected) {
                startAnimation();
            } else {
                stopAnimation();
            }
            syncQueueSourceAndRender();
            renderNow();
            refreshQueueEtaLabels();
        }

        const socket = io(window.location.origin, {
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 2000
        });

        socket.on('connect', function() {
            overlayConnected = true;
            document.getElementById('connection-status').hidden = true;
            renderQueue();
            try { socket.emit('request_state'); } catch (e) {}
        });
        function handleDisconnect() {
            overlayConnected = false;
            nowPlayingNeedsSync = true;
            const status = document.getElementById('connection-status');
            status.textContent = 'Reconnecting… Queue and playback times may be out of date.';
            status.hidden = false;
            nowStateEl.textContent = 'Reconnecting';
            stopAnimation();
            stopQueueAutoScroll();
            renderQueue();
        }
        socket.on('disconnect', handleDisconnect);
        socket.on('connect_error', handleDisconnect);
        socket.on('update_now_playing', handleNow);
        socket.on('update_spotify_queue', function(data) {
            if (!Array.isArray(data)) return;
            spotifyQueueItems = data;
            syncQueueSourceAndRender();
        });
        socket.on('update_queue', function(data) {
            requestQueueItems = Array.isArray(data) ? data : [];
            syncQueueSourceAndRender();
        });
        socket.on('update_spotify_queue_status', function(data) {
            if (!data || typeof data !== 'object') return;
            spotifyQueueStatus = data;
            syncQueueSourceAndRender();
        });
        socket.on('request_feedback', handleRequestFeedback);

        // Initialize
        cacheElements();
        nowArtEl.addEventListener('error', function() {
            nowArtEl.classList.add('no-art');
            if (nowArtEl.getAttribute('src') !== FALLBACK_NOW_ART) nowArtEl.src = FALLBACK_NOW_ART;
        });
        renderNow();
        if (!etaTickerId) {
            etaTickerId = setInterval(() => {
                if (isVisible) refreshQueueEtaLabels();
            }, 1000);
        }
        document.addEventListener('visibilitychange', () => {
            isVisible = !document.hidden;
            if (isVisible && overlayConnected && nowPlaying && nowPlaying.playing) {
                startAnimation();
            } else {
                stopAnimation();
            }
        });
        window.addEventListener('beforeunload', () => {
            stopAnimation();
            stopQueueAutoScroll();
            if (etaTickerId) {
                clearInterval(etaTickerId);
                etaTickerId = null;
            }
        });
    </script>
</body>
</html>
