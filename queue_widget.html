<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Queue Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(120% 120% at 50% 0%, rgba(16, 18, 22, 0.98) 0%, rgba(7, 7, 7, 0.98) 55%, rgba(4, 4, 4, 1) 100%);
            font-family: 'Montserrat', sans-serif;
            color: #fff;
        }
        html.transparent-bg, html.transparent-bg body {
            background: transparent;
        }

        :root {
            --panel-bg: rgba(7, 7, 7, 0.94);
            --border: rgba(255,255,255,0.16);
            --muted: rgba(255,255,255,0.72);
            --soft: rgba(255,255,255,0.48);
            --accent: rgba(255,255,255,0.9);
            --accent1: #5b3e88;
            --accent2: #1aa6a0;
        }

        .widget {
            width: 100%;
            height: 100%;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 0 0 1px rgba(91,62,136,0.14) inset;
            overflow: hidden;
            position: relative;
        }
        .panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent1), var(--accent2));
            box-shadow: 0 0 12px rgba(26,166,160,0.35);
            pointer-events: none;
        }

        .now {
            padding: 14px 16px;
        }
        .now-wrap {
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        .now-art {
            width: clamp(90px, 12vw, 160px);
            height: clamp(90px, 12vw, 160px);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            object-fit: cover;
            flex-shrink: 0;
            background: rgba(255,255,255,0.07);
        }
        .now-art.no-art {
            object-fit: contain;
            padding: 10px;
            background: linear-gradient(135deg, rgba(91,62,136,0.34), rgba(26,166,160,0.34));
        }
        .now-main {
            flex: 1;
            min-width: 0;
        }

        .title {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
            color: var(--accent);
            font-size: clamp(16px, 3vw, 24px);
            text-shadow: 0 0 14px rgba(91,62,136,0.28);
        }

        .track {
            margin-top: 8px;
            font-size: clamp(18px, 3.6vw, 36px);
            font-weight: 900;
            line-height: 1.18;
            word-break: break-word;
        }

        .time-row {
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            color: var(--muted);
            font-size: clamp(14px, 2.2vw, 22px);
            font-weight: 800;
        }

        .bar {
            margin-top: 10px;
            width: 100%;
            height: 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.09);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.12);
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--accent1), var(--accent2));
            transition: width 0.35s linear;
            box-shadow: 0 0 12px rgba(26,166,160,0.35);
        }

        @media (prefers-reduced-motion: reduce) {
            .bar-fill {
                transition: none;
            }
        }

        .queue-panel {
            flex: 1;
            min-height: 0;
            padding: 10px 12px 12px;
            display: flex;
            flex-direction: column;
        }

        .queue-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        .count {
            color: rgba(255,255,255,0.92);
            font-size: clamp(12px, 1.7vw, 18px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 10px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(91,62,136,0.35), rgba(26,166,160,0.35));
            border: 1px solid rgba(255,255,255,0.22);
        }
        .status {
            margin: 0 4px 8px;
            color: var(--muted);
            font-size: clamp(10px, 1.4vw, 14px);
            font-weight: 700;
            line-height: 1.2;
        }

        .queue-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.25) transparent;
        }

        .queue-item {
            border: 1px solid rgba(255,255,255,0.14);
            background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.025));
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            border-left: 3px solid rgba(26,166,160,0.8);
        }

        .art {
            width: clamp(48px, 8vw, 72px);
            height: clamp(48px, 8vw, 72px);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            object-fit: cover;
            flex-shrink: 0;
            background: rgba(255,255,255,0.07);
        }

        .item-main {
            min-width: 0;
            flex: 1;
        }

        .song {
            font-size: clamp(14px, 2.4vw, 28px);
            font-weight: 900;
            line-height: 1.2;
        }

        .meta {
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            color: var(--muted);
            font-size: clamp(11px, 1.7vw, 17px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }
        .eta {
            margin-top: 7px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            color: rgba(255,255,255,0.98);
            font-size: clamp(14px, 2.1vw, 24px);
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(91,62,136,0.22);
        }
        .eta-label {
            color: rgba(255,255,255,0.7);
            font-weight: 800;
            margin-right: 4px;
        }

        .empty {
            height: 100%;
            display: grid;
            place-items: center;
            text-align: center;
            color: var(--soft);
            font-size: clamp(14px, 2.2vw, 24px);
            font-weight: 700;
            padding: 16px;
        }

        .request-toast {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%) translateY(-22px);
            background: rgba(6, 7, 10, 0.96);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 999px;
            padding: 8px 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.95);
            font-size: clamp(12px, 1.7vw, 18px);
            font-weight: 900;
            letter-spacing: 0.3px;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 0.25s ease, transform 0.25s ease;
            box-shadow: 0 10px 24px rgba(0,0,0,0.45);
            max-width: min(92vw, 900px);
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }
        .request-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .request-toast.accepted {
            border-color: rgba(26,166,160,0.7);
            box-shadow: 0 10px 24px rgba(0,0,0,0.45), 0 0 0 1px rgba(26,166,160,0.3) inset;
        }
        .request-toast.rejected {
            border-color: rgba(255,162,88,0.7);
            box-shadow: 0 10px 24px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,162,88,0.3) inset;
        }
        .request-toast-icon {
            font-size: clamp(12px, 1.7vw, 18px);
            line-height: 1;
            flex-shrink: 0;
        }
        .request-toast-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (orientation: portrait) {
            .widget { padding: 8px; gap: 8px; }
            .now { padding: 11px 12px; }
            .queue-item { padding: 8px 10px; margin-bottom: 6px; }
            .now-wrap { gap: 10px; }
            .request-toast {
                top: 10px;
                max-width: 96vw;
                padding: 7px 11px;
            }
        }
    </style>
</head>
<body>
    <div class="widget">
        <section class="panel now">
            <div class="now-wrap">
                <img class="now-art no-art" id="now-art" alt="">
                <div class="now-main">
                    <div class="title">Now Playing</div>
                    <div class="track" id="now-track">Waiting for Spotify</div>
                    <div class="time-row">
                        <div id="now-time">--:-- / --:--</div>
                        <div id="now-state">-</div>
                    </div>
                    <div class="bar"><div class="bar-fill" id="now-bar"></div></div>
                </div>
            </div>
        </section>

        <section class="panel queue-panel">
            <div class="queue-head">
                <div class="title">Up Next</div>
                <div class="count" id="queue-count">0 queued</div>
            </div>
            <div class="status" id="queue-status">Waiting for queue sync...</div>
            <div class="queue-list" id="queue-list">
                <div class="empty">No queued songs yet</div>
            </div>
        </section>
    </div>
    <div class="request-toast" id="request-toast" role="status" aria-live="polite">
        <span class="request-toast-icon" id="request-toast-icon">&#127911;</span>
        <span class="request-toast-text" id="request-toast-text"></span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        let nowPlaying = null;
        const PAGE_PARAMS = new URLSearchParams(window.location.search);
        let nowAnchorMs = 0;
        let nowDisplayedElapsed = 0;
        let nowKey = '';
        let requestQueueItems = [];
        let spotifyQueueItems = [];
        let queueItems = [];
        const QUEUE_SOURCE_MODE = String(PAGE_PARAMS.get('queue_source') || 'spotify').trim().toLowerCase();
        const FORCE_SPOTIFY_SOURCE = QUEUE_SOURCE_MODE === 'spotify';
        const AUTO_SOURCE_MODE = QUEUE_SOURCE_MODE === 'auto';
        let usingSpotifyQueue = FORCE_SPOTIFY_SOURCE;
        let spotifyQueueStatus = { auth_ready: false, count: 0, last_error: '', updated_at: 0, manual_only: false, manual_pending: 0, manual_mode: 'tracked' };
        let lastQueueSignature = '';
        const AUTO_SCROLL_ENABLED = false;
        const AUTO_SCROLL_SPEED_PX_PER_SEC = 26;
        const AUTO_SCROLL_EDGE_PAUSE_MS = 1600;
        const AUTO_SCROLL_START_DELAY_MS = 1000;
        const AUTO_SCROLL_MIN_OVERFLOW_PX = 18;
        const AUTO_SCROLL_TICK_MS = 60;
        const DEFAULT_QUEUE_DURATION_SEC = 210;
        const FALLBACK_NOW_ART = 'data:image/svg+xml;utf8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">' +
            '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
            '<stop offset="0" stop-color="#5b3e88"/><stop offset="1" stop-color="#1aa6a0"/>' +
            '</linearGradient></defs>' +
            '<rect width="220" height="220" rx="20" fill="url(#g)"/>' +
            '<circle cx="110" cy="110" r="58" fill="rgba(0,0,0,0.24)"/>' +
            '<circle cx="110" cy="110" r="18" fill="rgba(255,255,255,0.85)"/>' +
            '<text x="110" y="194" fill="rgba(255,255,255,0.92)" text-anchor="middle" font-family="Montserrat, Arial" font-size="18" font-weight="700">NOW PLAYING</text>' +
            '</svg>'
        );

        // Cached DOM elements
        let nowTrackEl, nowTimeEl, nowStateEl, nowBarEl, nowArtEl;
        // Last rendered values
        let lastTitle = '', lastArtist = '', lastElapsed = 0, lastDuration = 0, lastPlaying = false, lastArt = '';
        // Animation control
        let nowTickerId = null;
        const NOW_TICK_MS = 250;
        let isVisible = true;
        let etaTickerId = null;
        let queueAutoScrollTimerId = null;
        let queueAutoScrollLastTickMs = 0;
        let queueAutoScrollDir = 1;
        let queueAutoScrollPauseUntil = 0;
        let queueAutoScrollArmedUntil = 0;
        let requestToastTimerId = null;

        if (PAGE_PARAMS.get('bg') === 'transparent' || PAGE_PARAMS.get('transparent') === '1') {
            document.documentElement.classList.add('transparent-bg');
        }

        function cacheElements() {
            nowTrackEl = document.getElementById('now-track');
            nowTimeEl = document.getElementById('now-time');
            nowStateEl = document.getElementById('now-state');
            nowBarEl = document.getElementById('now-bar');
            nowArtEl = document.getElementById('now-art');
        }

        function startAnimation() {
            if (nowTickerId) return;
            nowTickerId = setInterval(function() {
                if (isVisible && nowPlaying && nowPlaying.playing) {
                    renderNow();
                }
            }, NOW_TICK_MS);
        }

        function stopAnimation() {
            if (nowTickerId) {
                clearInterval(nowTickerId);
                nowTickerId = null;
            }
        }

        function fmt(sec) {
            const s = Math.max(0, Math.floor(Number(sec) || 0));
            const m = Math.floor(s / 60);
            const r = s % 60;
            return m + ':' + String(r).padStart(2, '0');
        }

        function fmtEta(sec, estimated) {
            return (estimated ? '~' : '') + fmt(sec);
        }

        function currentElapsedSec() {
            if (!nowPlaying || !nowPlaying.available) return 0;
            let elapsedCandidate = nowPlaying.playing
                ? ((Date.now() - nowAnchorMs) / 1000)
                : nowPlaying.elapsed;
            elapsedCandidate = Math.max(0, Math.min(elapsedCandidate, nowPlaying.duration || elapsedCandidate));

            if (nowPlaying.playing) {
                // Keep ETA countdown monotonic while playing to prevent jittery backwards jumps.
                nowDisplayedElapsed = Math.max(nowDisplayedElapsed, elapsedCandidate);
            } else {
                nowDisplayedElapsed = elapsedCandidate;
            }
            if (nowPlaying.duration > 0) {
                nowDisplayedElapsed = Math.min(nowDisplayedElapsed, nowPlaying.duration);
            }
            return Math.max(0, nowDisplayedElapsed);
        }

        function showRequestToast(message, kind) {
            const toast = document.getElementById('request-toast');
            const text = document.getElementById('request-toast-text');
            const icon = document.getElementById('request-toast-icon');
            if (!toast || !text || !icon) return;

            const type = String(kind || 'accepted').toLowerCase() === 'rejected' ? 'rejected' : 'accepted';
            toast.classList.remove('accepted', 'rejected', 'show');
            toast.classList.add(type);
            icon.innerHTML = type === 'accepted' ? '&#127911;' : '&#9888;';
            text.textContent = String(message || '');

            toast.classList.add('show');
            if (requestToastTimerId) clearTimeout(requestToastTimerId);
            requestToastTimerId = setTimeout(function() {
                toast.classList.remove('show');
            }, 3200);
        }

        function handleRequestFeedback(payload) {
            if (!payload || typeof payload !== 'object') return;
            const status = String(payload.status || '').toLowerCase();
            const reason = String(payload.reason || '').toLowerCase();
            const user = String(payload.user || 'viewer');
            const song = String(payload.song || 'request');

            if (status === 'accepted') {
                showRequestToast('Added: ' + song + ' (' + user + ')', 'accepted');
                return;
            }

            if (reason === 'cooldown') {
                const waitSec = Math.max(0, Math.floor(Number(payload.wait_seconds) || 0));
                const waitText = waitSec > 0 ? ('Try again in ' + waitSec + 's') : 'Try again soon';
                showRequestToast('Hold up ' + user + '. ' + waitText, 'rejected');
                return;
            }

            if (reason === 'duplicate_recent') {
                showRequestToast('Already requested recently: ' + song, 'rejected');
            }
        }

        function parseSong(raw) {
            let title = String(raw || '').trim();
            let artist = '';
            const upper = title.toUpperCase();
            if (upper.includes(' BY ')) {
                const idx = upper.indexOf(' BY ');
                artist = title.substring(idx + 4).trim();
                title = title.substring(0, idx).trim();
            }
            return { title, artist };
        }

        function normalizedQueueItem(item) {
            const raw = item || {};
            const spotifyTrack = String(raw.spotify_track || '').trim();
            const spotifyArtist = String(raw.spotify_artist || '').trim();
            const albumArt = String(raw.album_art || '').trim();
            if (spotifyTrack) {
                return {
                    title: spotifyTrack,
                    artist: spotifyArtist,
                    user: String(raw.user || ''),
                    duration_sec: Math.floor(Number(raw.duration_sec) || 0),
                    source: String(raw.source || 'spotify_queue'),
                    album_art: albumArt
                };
            }
            const parsed = parseSong(raw.song);
            return {
                title: parsed.title,
                artist: parsed.artist,
                user: String(raw.user || ''),
                duration_sec: Math.floor(Number(raw.duration_sec) || 0),
                source: String(raw.source || 'request_queue'),
                album_art: albumArt
            };
        }

        function queueSignature(list) {
            try {
                return JSON.stringify((list || []).map(function(it) {
                    return {
                        t: String(it.spotify_track || it.song || ''),
                        a: String(it.spotify_artist || ''),
                        d: Number(it.duration_sec || 0),
                        s: String(it.source || ''),
                        u: String(it.user || '')
                    };
                }));
            } catch (e) {
                return String(Date.now());
            }
        }

        function remainingNowSec() {
            if (!nowPlaying || !nowPlaying.available || nowPlaying.duration <= 0) {
                return { remaining: 0, estimated: true };
            }
            const elapsed = currentElapsedSec();
            return { remaining: Math.max(0, Math.floor(nowPlaying.duration - elapsed)), estimated: false };
        }

        function queueWindow(index) {
            const base = remainingNowSec();
            let startSec = base.remaining;
            let estimatedStart = base.estimated;

            for (let i = 0; i < index; i++) {
                let d = Math.floor(Number((queueItems[i] || {}).duration_sec) || 0);
                if (d <= 0) {
                    d = DEFAULT_QUEUE_DURATION_SEC;
                    estimatedStart = true;
                }
                startSec += d;
            }

            let dThis = Math.floor(Number((queueItems[index] || {}).duration_sec) || 0);
            let estimatedEnd = estimatedStart;
            if (dThis <= 0) {
                dThis = DEFAULT_QUEUE_DURATION_SEC;
                estimatedEnd = true;
            }
            return {
                start: Math.max(0, startSec),
                end: Math.max(0, startSec + dThis),
                estimatedStart,
                estimatedEnd
            };
        }

        function refreshQueueEtaLabels() {
            if (!Array.isArray(queueItems) || queueItems.length === 0) return;

            document.querySelectorAll('.eta-start[data-index]').forEach((el) => {
                const idx = Number(el.getAttribute('data-index'));
                if (!Number.isFinite(idx)) return;
                const win = queueWindow(idx);
                el.textContent = fmtEta(win.start, win.estimatedStart);
            });

            document.querySelectorAll('.eta-end[data-index]').forEach((el) => {
                const idx = Number(el.getAttribute('data-index'));
                if (!Number.isFinite(idx)) return;
                const win = queueWindow(idx);
                el.textContent = fmtEta(win.end, win.estimatedEnd);
            });
        }

        function stopQueueAutoScroll() {
            if (queueAutoScrollTimerId) {
                clearInterval(queueAutoScrollTimerId);
                queueAutoScrollTimerId = null;
            }
            queueAutoScrollLastTickMs = 0;
        }

        function queueAutoScrollTick() {
            const list = document.getElementById('queue-list');
            if (!list || !AUTO_SCROLL_ENABLED) {
                stopQueueAutoScroll();
                return;
            }

            const overflow = Math.max(0, list.scrollHeight - list.clientHeight);
            if (overflow < AUTO_SCROLL_MIN_OVERFLOW_PX) {
                list.scrollTop = 0;
                queueAutoScrollLastTickMs = Date.now();
                return;
            }

            const now = Date.now();
            if (now < queueAutoScrollArmedUntil || now < queueAutoScrollPauseUntil) {
                queueAutoScrollLastTickMs = now;
                return;
            }

            if (!queueAutoScrollLastTickMs) queueAutoScrollLastTickMs = now;
            const dt = Math.min(0.25, Math.max(0, (now - queueAutoScrollLastTickMs) / 1000));
            queueAutoScrollLastTickMs = now;

            let nextTop = list.scrollTop + (queueAutoScrollDir * AUTO_SCROLL_SPEED_PX_PER_SEC * dt);

            if (queueAutoScrollDir > 0 && nextTop >= overflow) {
                nextTop = overflow;
                queueAutoScrollDir = -1;
                queueAutoScrollPauseUntil = now + AUTO_SCROLL_EDGE_PAUSE_MS;
            } else if (queueAutoScrollDir < 0 && nextTop <= 0) {
                nextTop = 0;
                queueAutoScrollDir = 1;
                queueAutoScrollPauseUntil = now + AUTO_SCROLL_EDGE_PAUSE_MS;
            }

            list.scrollTop = nextTop;
        }

        function startQueueAutoScroll(resetPosition) {
            const list = document.getElementById('queue-list');
            if (!list || !AUTO_SCROLL_ENABLED) return;
            if (queueAutoScrollTimerId && !resetPosition) {
                return;
            }
            if (resetPosition) {
                list.scrollTop = 0;
                queueAutoScrollDir = 1;
                queueAutoScrollPauseUntil = 0;
            }
            queueAutoScrollArmedUntil = Date.now() + AUTO_SCROLL_START_DELAY_MS;
            queueAutoScrollLastTickMs = Date.now();
            if (!queueAutoScrollTimerId) {
                queueAutoScrollTimerId = setInterval(queueAutoScrollTick, AUTO_SCROLL_TICK_MS);
                queueAutoScrollTick();
            }
        }

        function syncQueueSourceAndRender() {
            if (FORCE_SPOTIFY_SOURCE) {
                usingSpotifyQueue = true;
                queueItems = Array.isArray(spotifyQueueItems) ? spotifyQueueItems : [];
            } else if (AUTO_SOURCE_MODE) {
                const spotifyReady = !!(spotifyQueueStatus && spotifyQueueStatus.auth_ready);
                const hasSpotifyItems = Array.isArray(spotifyQueueItems) && spotifyQueueItems.length > 0;
                usingSpotifyQueue = spotifyReady && hasSpotifyItems;
                queueItems = usingSpotifyQueue
                    ? spotifyQueueItems
                    : (Array.isArray(requestQueueItems) ? requestQueueItems : []);
            } else {
                usingSpotifyQueue = false;
                queueItems = Array.isArray(requestQueueItems) ? requestQueueItems : [];
            }
            renderQueue();
        }

        function renderQueue() {
            const list = document.getElementById('queue-list');
            const count = document.getElementById('queue-count');
            const status = document.getElementById('queue-status');
            const n = Array.isArray(queueItems) ? queueItems.length : 0;

            // Always update status/count, but only rebuild list when queue data changed.
            const sig = queueSignature(queueItems);
            const queueChanged = sig !== lastQueueSignature;
            count.textContent = n + (n === 1 ? ' track queued' : ' tracks queued');
            if (status) {
                const manualOnly = !!(spotifyQueueStatus && spotifyQueueStatus.manual_only);
                const manualPending = Math.max(0, Number((spotifyQueueStatus && spotifyQueueStatus.manual_pending) || 0));
                const manualMode = String((spotifyQueueStatus && spotifyQueueStatus.manual_mode) || 'tracked').toLowerCase();
                if (!FORCE_SPOTIFY_SOURCE && !AUTO_SOURCE_MODE) {
                    status.textContent = 'Source: Request queue';
                } else if (usingSpotifyQueue) {
                    if (manualOnly) {
                        const modeLabel = manualMode === 'bootstrap' ? 'bootstrap' : 'tracked';
                        status.textContent = 'Source: Spotify queue (manual only, ' + modeLabel + ' ' + manualPending + ')';
                    } else {
                        status.textContent = 'Source: Spotify queue';
                    }
                } else if (FORCE_SPOTIFY_SOURCE && spotifyQueueStatus.last_error) {
                    status.textContent = 'Spotify queue sync error: ' + spotifyQueueStatus.last_error;
                } else if (FORCE_SPOTIFY_SOURCE && !spotifyQueueStatus.auth_ready) {
                    status.textContent = 'Spotify queue unavailable: missing API credentials.';
                } else if (FORCE_SPOTIFY_SOURCE && manualOnly) {
                    status.textContent = 'Source: Spotify queue (manual only, no tracked items yet)';
                } else if (AUTO_SOURCE_MODE && spotifyQueueStatus.auth_ready) {
                    status.textContent = 'Source: Request queue (Spotify queue empty)';
                } else {
                    status.textContent = 'Source: Request queue';
                }
            }
            if (!queueChanged) {
                refreshQueueEtaLabels();
                startQueueAutoScroll(false);
                return;
            }
            lastQueueSignature = sig;

            if (!n) {
                list.innerHTML = '<div class="empty">No queued songs yet</div>';
                stopQueueAutoScroll();
                return;
            }

            const fragment = document.createDocumentFragment();
            queueItems.forEach((item, i) => {
                const p = normalizedQueueItem(item);
                const win = queueWindow(i);
                const startTxt = fmtEta(win.start, win.estimatedStart);
                const endTxt = fmtEta(win.end, win.estimatedEnd);
                const requester = String(p.user || '').trim();
                const sourceLabel = p.source === 'spotify_queue' ? 'Spotify Queue' : 'Requests';

                const div = document.createElement('div');
                div.className = 'queue-item';

                const artDiv = document.createElement('div');
                if (p.album_art) {
                    const img = document.createElement('img');
                    img.className = 'art';
                    img.src = p.album_art;
                    img.alt = 'Album art';
                    img.loading = 'lazy';
                    img.decoding = 'async';
                    img.referrerPolicy = 'no-referrer';
                    artDiv.appendChild(img);
                } else {
                    artDiv.className = 'art';
                }

                const mainDiv = document.createElement('div');
                mainDiv.className = 'item-main';

                const songDiv = document.createElement('div');
                songDiv.className = 'song';
                songDiv.textContent = p.title || 'Unknown Song';

                mainDiv.appendChild(songDiv);

                if (p.artist) {
                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'meta';
                    const span = document.createElement('span');
                    span.textContent = 'Artist: ' + p.artist;
                    metaDiv.appendChild(span);
                    mainDiv.appendChild(metaDiv);
                }

                const metaDiv2 = document.createElement('div');
                metaDiv2.className = 'meta';
                const spanSource = document.createElement('span');
                if (requester) {
                    spanSource.textContent = 'Requested by: ' + requester;
                } else {
                    spanSource.textContent = 'Source: ' + sourceLabel;
                }
                metaDiv2.appendChild(spanSource);
                mainDiv.appendChild(metaDiv2);

                const etaDiv = document.createElement('div');
                etaDiv.className = 'eta';
                const spanStarts = document.createElement('span');
                const labelStarts = document.createElement('span');
                labelStarts.className = 'eta-label';
                labelStarts.textContent = 'Starts In';
                spanStarts.appendChild(labelStarts);
                const startValue = document.createElement('span');
                startValue.className = 'eta-start';
                startValue.setAttribute('data-index', String(i));
                startValue.textContent = startTxt;
                spanStarts.appendChild(startValue);
                etaDiv.appendChild(spanStarts);

                const spanEnds = document.createElement('span');
                const labelEnds = document.createElement('span');
                labelEnds.className = 'eta-label';
                labelEnds.textContent = 'Ends In';
                spanEnds.appendChild(labelEnds);
                const endValue = document.createElement('span');
                endValue.className = 'eta-end';
                endValue.setAttribute('data-index', String(i));
                endValue.textContent = endTxt;
                spanEnds.appendChild(endValue);
                etaDiv.appendChild(spanEnds);

                mainDiv.appendChild(etaDiv);

                div.appendChild(artDiv);
                div.appendChild(mainDiv);
                fragment.appendChild(div);
            });

            list.innerHTML = '';
            list.appendChild(fragment);
            if (!AUTO_SCROLL_ENABLED) {
                list.scrollTop = 0;
            }
            refreshQueueEtaLabels();
            startQueueAutoScroll(true);
        }

        function renderNow() {
            if (!nowPlaying || !nowPlaying.available) {
                if (lastTitle !== 'Waiting for Spotify' || lastElapsed !== 0 || lastDuration !== 0 || lastPlaying !== false || lastArt !== FALLBACK_NOW_ART) {
                    nowTrackEl.textContent = 'Waiting for Spotify';
                    nowTimeEl.textContent = '--:-- / --:--';
                    nowStateEl.textContent = '-';
                    nowBarEl.style.width = '0%';
                    nowArtEl.classList.add('no-art');
                    nowArtEl.src = FALLBACK_NOW_ART;
                    lastTitle = 'Waiting for Spotify';
                    lastElapsed = 0;
                    lastDuration = 0;
                    lastPlaying = false;
                    lastArt = FALLBACK_NOW_ART;
                }
                return;
            }

            const title = nowPlaying.title || 'Unknown Track';
            const artist = nowPlaying.artist || '';
            const label = title + (artist ? ' - ' + artist : '');
            const elapsed = currentElapsedSec();
            const duration = Math.max(0, nowPlaying.duration || 0);
            const barWidth = duration > 0 ? Math.min(100, (elapsed / duration) * 100) : 0;
            const art = String(nowPlaying.album_art || '').trim();

            const elapsedRounded = Math.floor(elapsed);
            if (label !== lastTitle || elapsedRounded !== lastElapsed || duration !== lastDuration || nowPlaying.playing !== lastPlaying || art !== lastArt) {
                nowTrackEl.textContent = label;
                nowTimeEl.textContent = fmt(elapsedRounded) + ' / ' + fmt(duration);
                nowStateEl.textContent = nowPlaying.playing ? 'Playing' : 'Paused';
                nowBarEl.style.width = barWidth + '%';
                if (art) {
                    nowArtEl.classList.remove('no-art');
                    nowArtEl.src = art;
                } else {
                    nowArtEl.classList.add('no-art');
                    nowArtEl.src = FALLBACK_NOW_ART;
                }
                lastTitle = label;
                lastElapsed = elapsedRounded;
                lastDuration = duration;
                lastPlaying = nowPlaying.playing;
                lastArt = art || FALLBACK_NOW_ART;
            }
        }

        function handleNow(data) {
            if (!data || !data.available) {
                nowPlaying = null;
                nowKey = '';
                nowAnchorMs = 0;
                nowDisplayedElapsed = 0;
                stopAnimation();
                renderNow();
                return;
            }

            const incoming = {
                available: true,
                title: String(data.title || '').trim(),
                artist: String(data.artist || '').trim(),
                elapsed: Math.max(0, Math.floor(Number(data.elapsed) || 0)),
                duration: Math.max(0, Math.floor(Number(data.duration) || 0)),
                playing: !!data.playing,
                album_art: String(data.album_art || '').trim()
            };

            const key = (incoming.title + '|' + incoming.artist).toLowerCase();
            const nowMs = Date.now();
            if (!nowKey || key !== nowKey) {
                nowAnchorMs = nowMs - (incoming.elapsed * 1000);
                nowDisplayedElapsed = incoming.elapsed;
                nowKey = key;
            } else {
                const localElapsed = nowPlaying && nowPlaying.playing
                    ? Math.max(nowDisplayedElapsed, ((nowMs - nowAnchorMs) / 1000))
                    : nowDisplayedElapsed;
                const drift = incoming.elapsed - localElapsed;
                // Apply only larger corrections. Small drift is expected polling jitter.
                if (drift > 2.2) {
                    nowAnchorMs = nowMs - (incoming.elapsed * 1000);
                } else if (drift < -5) {
                    nowAnchorMs = nowMs - (incoming.elapsed * 1000);
                    nowDisplayedElapsed = incoming.elapsed;
                }
            }

            if (!incoming.playing) {
                nowAnchorMs = nowMs - (incoming.elapsed * 1000);
                nowDisplayedElapsed = incoming.elapsed;
            }

            nowPlaying = incoming;
            if (incoming.playing && isVisible) {
                startAnimation();
            } else {
                stopAnimation();
            }
            renderNow();
            refreshQueueEtaLabels();
        }

        const socket = io(window.location.origin, {
            transports: ['polling', 'websocket'],
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 2000
        });

        socket.on('connect', function() {
            try { socket.emit('request_state'); } catch (e) {}
        });
        socket.on('update_now_playing', handleNow);
        socket.on('update_spotify_queue', function(data) {
            if (!Array.isArray(data)) return;
            spotifyQueueItems = data;
            syncQueueSourceAndRender();
        });
        socket.on('update_queue', function(data) {
            requestQueueItems = Array.isArray(data) ? data : [];
            syncQueueSourceAndRender();
        });
        socket.on('update_spotify_queue_status', function(data) {
            if (!data || typeof data !== 'object') return;
            spotifyQueueStatus = data;
            syncQueueSourceAndRender();
        });
        socket.on('request_feedback', handleRequestFeedback);

        // Initialize
        cacheElements();
        if (!etaTickerId) {
            etaTickerId = setInterval(() => {
                if (isVisible) refreshQueueEtaLabels();
            }, 1000);
        }
        document.addEventListener('visibilitychange', () => {
            isVisible = !document.hidden;
            if (isVisible && nowPlaying && nowPlaying.playing) {
                startAnimation();
            } else {
                stopAnimation();
            }
        });
        window.addEventListener('beforeunload', () => {
            stopAnimation();
            stopQueueAutoScroll();
            if (etaTickerId) {
                clearInterval(etaTickerId);
                etaTickerId = null;
            }
        });
    </script>
</body>
</html>
